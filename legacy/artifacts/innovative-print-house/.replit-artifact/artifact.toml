kind = "web"
previewPath = "/"
title = "Innovative Print House"
version = "1.0.0"
id = "artifacts/innovative-print-house"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19246

[services.development]
run = "pnpm --filter @workspace/innovative-print-house run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/innovative-print-house", "run", "build" ]
publicDir = "artifacts/innovative-print-house/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19246"
BASE_PATH = "/"
